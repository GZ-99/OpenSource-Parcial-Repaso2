@if (store.loading()) {
  <mat-spinner diameter="40"></mat-spinner>
}
@if (store.error()) {
  <mat-error>{{ store.error() }}</mat-error>
}
<table mat-table [dataSource]="store.vehicles()" class="mat-elevation-z8">
  <!-- ID Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let vehicle"> {{ vehicle.id }} </td>
  </ng-container>

  <!-- Make Column -->
  <ng-container matColumnDef="make">
    <th mat-header-cell *matHeaderCellDef> Make </th>
    <td mat-cell *matCellDef="let vehicle"> {{ vehicle.make }} </td>
  </ng-container>

  <!-- Model Column -->
  <ng-container matColumnDef="model">
    <th mat-header-cell *matHeaderCellDef> Model </th>
    <td mat-cell *matCellDef="let vehicle"> {{ vehicle.model }} </td>
  </ng-container>

  <!-- MileageKm Column -->
  <ng-container matColumnDef="mileageKm">
    <th mat-header-cell *matHeaderCellDef> MileageKm </th>
    <td mat-cell *matCellDef="let vehicle"> {{ vehicle.mileageKm }} </td>
  </ng-container>

  <!-- DailyRate Column -->
  <ng-container matColumnDef="dailyRate">
    <th mat-header-cell *matHeaderCellDef> DailyRate </th>
    <td mat-cell *matCellDef="let vehicle"> {{ vehicle.dailyRate }} </td>
  </ng-container>

  <!-- VehicleType Column -->
  <ng-container matColumnDef="vehicleType">
    <th mat-header-cell *matHeaderCellDef> VehicleType </th>
    <td mat-cell *matCellDef="let vehicle"> {{ vehicle.vehicleType }} </td>
  </ng-container>

  <!-- Status Column -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef> Status </th>
    <td mat-cell *matCellDef="let vehicle"> {{ vehicle.status }} </td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let vehicle">
      <button mat-button (click)="editVehicle(vehicle.id)">Edit</button>
      <button mat-button (click)="deleteVehicle(vehicle.id)">Delete</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<button mat-raised-button color="primary" (click)="router.navigate(['services/vehicles/new'])">Add Vehicle</button>
